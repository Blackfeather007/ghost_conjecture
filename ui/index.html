<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学条目依赖关系管理器</title>
    <link rel="stylesheet" href="styles.css">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- vis.js for graph visualization -->
    <script type="text/javascript" src="https://unpkg.com/vis-network@latest/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>数学条目依赖关系管理器</h1>
            <div class="file-controls">
                <label for="file-input" class="btn btn-primary">
                    <input type="file" id="file-input" accept=".json" style="display: none;">
                    选择JSON文件
                </label>
                <button id="export-btn" class="btn btn-success" disabled>导出JSON</button>
                <button id="view-toggle-btn" class="btn btn-secondary" disabled>切换到图视图</button>
                <span id="file-name" class="file-name"></span>
            </div>
        </header>

        <div class="main-content" id="main-content" style="display: none;">
            <!-- 列表视图 -->
            <div class="list-view" id="list-view">
            <div class="sidebar">
                <div class="filter-section">
                    <h3>筛选</h3>
                    <div class="filter-group">
                        <label>类型:</label>
                        <div class="filter-checkboxes" id="filter-type-checkboxes">
                            <label class="checkbox-label">
                                <input type="checkbox" class="filter-type-checkbox" value="" checked>
                                <span>全部</span>
                            </label>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label for="filter-section">章节:</label>
                        <select id="filter-section">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="search-input">搜索:</label>
                        <input type="text" id="search-input" placeholder="搜索内容...">
                    </div>
                </div>

                <div class="items-section">
                    <h3>条目列表 <span id="items-count"></span></h3>
                    <div id="items-list" class="items-list"></div>
                </div>
            </div>

            <div class="detail-panel">
                <div id="no-selection" class="no-selection">
                    <p>请从左侧列表选择一个条目进行编辑</p>
                </div>

                <div id="item-detail" class="item-detail" style="display: none;">
                    <div class="detail-header">
                        <h2 id="detail-title">条目详情</h2>
                        <button id="save-btn" class="btn btn-primary">保存修改</button>
                    </div>

                    <div class="detail-content">
                        <div class="form-group">
                            <label for="detail-type">类型:</label>
                            <input type="text" id="detail-type" readonly>
                        </div>

                        <div class="form-group">
                            <label for="detail-label">标签:</label>
                            <input type="text" id="detail-label" readonly>
                        </div>

                        <div class="form-group">
                            <label for="detail-section">章节:</label>
                            <input type="text" id="detail-section" readonly>
                        </div>

                        <div class="form-group">
                            <label for="detail-subsection">子章节:</label>
                            <input type="text" id="detail-subsection" readonly>
                        </div>

                        <div class="form-group">
                            <label for="detail-line-number">行号:</label>
                            <input type="number" id="detail-line-number" readonly>
                        </div>

                        <div class="form-group">
                            <label for="detail-content">内容:</label>
                            <textarea id="detail-content" rows="10"></textarea>
                            <div class="preview-section">
                                <h4>内容预览（LaTeX渲染）:</h4>
                                <div id="content-preview" class="latex-preview"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="detail-proof">证明:</label>
                            <textarea id="detail-proof" rows="5"></textarea>
                            <div class="preview-section">
                                <h4>证明预览（LaTeX渲染）:</h4>
                                <div id="proof-preview" class="latex-preview"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="detail-comment">注释:</label>
                            <textarea id="detail-comment" rows="3" placeholder="添加您的注释..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>依赖关系:</label>
                            <div class="dependencies-section">
                                <div class="dependencies-list" id="dependencies-list"></div>
                                <div class="add-dependency">
                                    <select id="dependency-select">
                                        <option value="">选择要添加的依赖...</option>
                                    </select>
                                    <button id="add-dependency-btn" class="btn btn-small">添加依赖</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>
            
            <!-- 图视图 -->
            <div class="graph-view" id="graph-view" style="display: none;">
                <div class="graph-controls">
                    <div class="graph-control-group">
                        <label for="graph-layout">布局算法:</label>
                        <select id="graph-layout">
                            <option value="hierarchical">层次布局</option>
                            <option value="force">力导向布局</option>
                            <option value="circular">圆形布局</option>
                        </select>
                    </div>
                    <div class="graph-control-group">
                        <label>筛选类型:</label>
                        <div class="graph-filter-checkboxes" id="graph-filter-type-checkboxes">
                            <label class="checkbox-label">
                                <input type="checkbox" class="graph-filter-type-checkbox" value="" checked>
                                <span>全部</span>
                            </label>
                        </div>
                    </div>
                    <div class="graph-control-group">
                        <button id="graph-reset-btn" class="btn btn-small">重置视图</button>
                        <button id="graph-fit-btn" class="btn btn-small">适应窗口</button>
                    </div>
                </div>
                <div id="graph-container" class="graph-container"></div>
                <div id="graph-info" class="graph-info">
                    <p>点击节点查看详情 | 拖拽节点移动 | 滚轮缩放</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
